name: Lint and Test

on: [push, pull_request]

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout

      - name: Set up uv
        uses: astral-sh/setup-uv
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Lint
        run: |
          uv run --group dev make lint

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout

      - name: Set up uv
        uses: astral-sh/setup-uv
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: |
          uv run --group dev --group test make test